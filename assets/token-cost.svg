<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <text x="0" y="18" font-size="14" font-weight="600" fill="#898781">Standing tokens paid over a 100-message session</text>
  <text x="0" y="36" font-size="12" fill="#898781">installed skill descriptions ride in the prompt on every message, used or not</text>

  <!-- 10 installed -->
  <text x="0" y="66" font-size="13" font-weight="600" fill="#898781">10 installed skills</text>
  <rect x="40" y="74" width="560" height="18" rx="4" fill="#898781" opacity="0.15"/>
  <rect x="40" y="74" width="65" height="18" rx="4" fill="#898781"/>
  <text x="113" y="88" font-size="12" font-weight="700" fill="#898781">~35,000</text>

  <!-- 25 installed -->
  <text x="0" y="122" font-size="13" font-weight="600" fill="#898781">25 installed skills</text>
  <rect x="40" y="130" width="560" height="18" rx="4" fill="#898781" opacity="0.15"/>
  <rect x="40" y="130" width="149" height="18" rx="4" fill="#898781"/>
  <text x="197" y="144" font-size="12" font-weight="700" fill="#898781">~80,000</text>

  <!-- 50 installed -->
  <text x="0" y="178" font-size="13" font-weight="600" fill="#898781">50 installed skills</text>
  <rect x="40" y="186" width="560" height="18" rx="4" fill="#898781" opacity="0.15"/>
  <rect x="40" y="186" width="299" height="18" rx="4" fill="#898781"/>
  <text x="347" y="200" font-size="12" font-weight="700" fill="#898781">~160,000</text>

  <!-- 100 installed -->
  <text x="0" y="234" font-size="13" font-weight="600" fill="#898781">100 installed skills</text>
  <rect x="40" y="242" width="560" height="18" rx="4" fill="#898781" opacity="0.15"/>
  <rect x="40" y="242" width="560" height="18" rx="4" fill="#898781"/>
  <text x="608" y="256" font-size="12" font-weight="700" fill="#898781">~300,000</text>

  <!-- deskill -->
  <text x="0" y="290" font-size="13" font-weight="600" fill="#898781">any number of skills, via deskill</text>
  <rect x="40" y="298" width="560" height="18" rx="4" fill="#898781" opacity="0.15"/>
  <rect x="40" y="298" width="4" height="18" rx="2" fill="#1baf7a"/>
  <text x="52" y="312" font-size="12" font-weight="700" fill="#1baf7a">0 — you pay only for what you actually use</text>
</svg>
