[project]
name = "deskill"
version = "0.1.0"
description = "Python implementation of the @skills protocol (SylphAI, arXiv 2608.12610): MCP server + CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
urls = { Repository = "https://github.com/NilotpalK/deskill", Protocol = "https://github.com/SylphAI-Inc/atskills" }
dependencies = ["pyyaml>=6", "pathspec>=0.12", "mcp>=1.0"]

[project.scripts]
deskill = "deskill.cli:main"
deskill-mcp = "deskill.mcp_server:run"

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["anthropic>=0.122"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
